# AI-Driven Metadata Curation Configuration

# LLM Configuration (Argo)
llm:
  provider: argo
  model: gpt56terra  # GPT model (Claude models have max_tokens issue with LangChain)
  temperature: 1
  max_tokens: 4096
  base_url: https://apps.inside.anl.gov/argoapi/v1

# Ontology Mappings
ontologies:
  UBERON:
    description: "Anatomical structures and tissues"
    fields_hint: "isolation_source, body_sample_site, tissue, organ"
  MONDO:
    description: "Diseases and clinical conditions"
    fields_hint: "note, disease, infection, clinical_context"
  ENVO:
    description: "Environmental contexts and locations"
    fields_hint: "isolation_source, geo_loc_name, environment, habitat"

# Field Selection Configuration (V2 combined.jsonl format)
#
# These lists guide which raw fields the ingest normaliser extracts into
# RecordInput.  The Plan agent LLM sees ALL RecordInput fields plus the
# full biosample_attributes dict, so it is deliberately broad.
field_selection:
  # Stop list: biosample attribute harmonized_names to never surface.
  # These are administrative / sequencing metadata, not useful for
  # ontology curation.
  ignore_attributes:
    - "collected_by"
    - "lat_lon"
    - "submission_date"
    - "publication_date"
    - "last_update"
    - "sra_sample"
    - "id"
    - "taxon_id"

  # Consider list: biosample attribute harmonized_names known to carry
  # ontology-relevant information.  The Plan agent also sees every
  # attribute not on the ignore list, so this is informational only.
  consider_attributes:
    - "isolation_source"
    - "host"
    - "host_disease"
    - "disease"
    - "body_sample_site"
    - "tissue"
    - "tissue_type"
    - "sample_type"
    - "env_medium"
    - "env_broad_scale"
    - "env_local_scale"
    - "geo_loc_name"
    - "collection_date"
    - "strain"
    - "note"
    - "description"

  # BV-BRC (bvbrc dict) fields to extract
  consider_bvbrc:
    - "isolation_source"
    - "host_name"
    - "host_common_name"
    - "body_sample_site"
    - "disease"
    - "geographic_location"
    - "collection_date"
    - "strain"
    - "comments"

# Parallelization Settings
# Stage commands, artifact paths and RAG settings live in ../../pipeline.yaml.
parallelism:
  max_workers: 10  # Number of records to process concurrently (increase to 10+ for production)
  stage_parallelism: true  # Enable parallel RAG calls within a single record (UBERON/MONDO/ENVO)
  batch_size: 100  # For batch processing modes

# Logging
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: data/out/pipeline.log
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
