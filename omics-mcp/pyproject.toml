[project]
name = "omics-mcp"
version = "0.1.0"
description = "MCP server exposing local NCBI genome/BV-BRC extracts alongside OmicIDX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "mcp>=2.0",
    "pandas>=2.0",
]

[project.scripts]
omics-mcp = "omics_mcp.server:main"
omics-mcp-build = "omics_mcp.build_parquet:main"
omics-mcp-export = "omics_mcp.export_combined:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omics_mcp"]
